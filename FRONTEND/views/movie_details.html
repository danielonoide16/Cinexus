<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
    <title>Cinexus - Movie Details</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/style/style.css" />
</head>
<body class="page-movie-details">

<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand nav-link" onclick="window.location.href='home.html'">🎬 Cinexus</span>
    <div class="navbar-user-group">
        <div id="navAvatar" class="avatar nav-avatar is-clickable" onclick="window.location.href='user_profile.html'" title="View profile">JD</div>
        <button class="btn btn-outline-light" onclick="cerrarSesion()">Logout</button>
    </div>
</nav>

<div class="container py-5">

    <div class="row g-4 mb-5">
        <div class="col-md-3">
            <img id="poster" src="" alt="poster" class="poster">
        </div>
        <div class="col-md-9">
            <h1 id="titulo" class="text-white"></h1>
            <p class="text-secondary" id="meta"></p>
            <p class="text-white-50" id="descripcion"></p>

            <!-- Trailer placeholder - conectar con backend -->
            <div class="trailer-wrapper mt-3">
                <div class="ratio ratio-16x9">
                    <iframe
                        id="trailerFrame"
                        referrerpolicy="strict-origin-when-cross-origin"
                        src=""
                        title="Trailer"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                        allowfullscreen>
                    </iframe>
                </div>
                <small id="trailerMessage" class="text-secondary d-block mt-2"></small>
            </div>

            <div class="d-flex align-items-center gap-2 mt-3">
                <select id="selectLista" class="form-select w-auto">
                    <option value="">Add to list...</option>
                </select>
                <button class="btn btn-morado" onclick="agregarALista()">+ Add</button>
            </div>
            <small id="mensajeLista" class="text-success mt-1 d-block"></small>
        </div>
    </div>

    <div class="caja-oscura p-4 mb-5">
        <h4 class="text-white mb-3">Write a Review</h4>
        <div id="selectorEstrellas" class="mb-2">
            <span class="estrella-btn" data-v="1">&#9733;</span>
            <span class="estrella-btn" data-v="2">&#9733;</span>
            <span class="estrella-btn" data-v="3">&#9733;</span>
            <span class="estrella-btn" data-v="4">&#9733;</span>
            <span class="estrella-btn" data-v="5">&#9733;</span>
        </div>
        <textarea id="textoResena" class="form-control mb-3" rows="3" placeholder="Share your thoughts..."></textarea>
        <button class="btn btn-morado" onclick="publicarResena()">Post</button>
    </div>

    <h4 class="text-white mb-3">Reviews</h4>
    <div id="contenedorResenas"></div>

</div>


<!-- Delete review modal -->
<div
    class="modal fade"
    id="deleteReviewModal"
    tabindex="-1"
    aria-labelledby="deleteReviewModalLabel"
    aria-hidden="true"
>
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-dark text-white">

            <div class="modal-header border-secondary">
                <h5 class="modal-title" id="deleteReviewModalLabel">
                    Delete Review
                </h5>

                <button
                    type="button"
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                ></button>
            </div>

            <div class="modal-body">
                Are you sure you want to delete your review?
                This action cannot be undone.
            </div>

            <div class="modal-footer border-secondary">
                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal"
                >
                    Cancel
                </button>

                <button
                    type="button"
                    class="btn btn-danger"
                    onclick="confirmDeleteReview()"
                >
                    Delete
                </button>
            </div>

        </div>
    </div>
</div>



<footer class="text-center py-3"><small>&copy; 2026 Cinexus - All rights reserved</small></footer>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>

<script src="../controllers/api.js"></script>
<script src="../controllers/movieController.js"></script>
<script src="../controllers/reviewController.js"></script>
<script>
const usuario = JSON.parse(localStorage.getItem('user'));
if (!usuario) window.location.href = 'login-register.html';


function getInitials(name) {
    return (name || '')
        .trim()
        .split(/\s+/)
        .filter(Boolean)
        .slice(0, 2)
        .map(part => part[0].toUpperCase())
        .join('') || 'JD';
}

(function() {
    const nav = document.getElementById('navAvatar');
    if (usuario.avatarUrl) {
        nav.innerHTML = `<img src="${API.replace('/api','') + usuario.avatarUrl}" alt="avatar" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
    } else {
        nav.textContent = getInitials(usuario.name);
    }
})();

const imdbID = new URLSearchParams(location.search).get('imdbID');
let tituloPelicula = '';
let movieId = '';


document.addEventListener('DOMContentLoaded', () => {
    deleteReviewModal = new bootstrap.Modal(
        document.getElementById('deleteReviewModal')
    );
});


function formatMovieMeta(movie) {
    const parts = [];
    if (movie.genres && movie.genres.length) parts.push(movie.genres.join(', '));
    if (movie.year) parts.push(movie.year);
    if (movie.rated) parts.push(movie.rated);
    if (movie.runtime) parts.push(`${movie.runtime} min`);
    return parts.join(' | ');
}

// Star selector
let estrellasSeleccionadas = 0;

document.querySelectorAll('.estrella-btn').forEach(s => {
    s.addEventListener('mouseover', () => resaltarEstrellas(+s.dataset.v));
    s.addEventListener('mouseout',  () => resaltarEstrellas(estrellasSeleccionadas));
    s.addEventListener('click',     () => { estrellasSeleccionadas = +s.dataset.v; resaltarEstrellas(estrellasSeleccionadas); });
});

function resaltarEstrellas(n) {
    document.querySelectorAll('.estrella-btn').forEach(s => s.classList.toggle('activa', +s.dataset.v <= n));
}


function cargarListas() {
    ajax('GET', '/lists/me', null, function(lists, status) {
        if (status !== 200) return;
        const select = document.getElementById('selectLista');
        select.innerHTML = '<option value="">Add to list...</option>';
        lists.forEach(function(l) {
            const opt = document.createElement('option');
            opt.value = l._id;
            opt.textContent = l.name;
            select.appendChild(opt);
        });
    });
}

function agregarALista() {
    const select = document.getElementById('selectLista');
    if (!select.value || !imdbID) return;
    ajax('POST', '/lists/' + select.value + '/movies', { imdbID: imdbID }, function(res, status) {
        const msg = document.getElementById('mensajeLista');
        if (status === 200) {
            msg.className = 'text-success mt-1 d-block';
            msg.textContent = '"' + tituloPelicula + '" added to "' + select.selectedOptions[0].text + '"';
        } else if (status === 409) {
            msg.className = 'text-warning mt-1 d-block';
            msg.textContent = 'Movie already in that list.';
        } else {
            msg.className = 'text-danger mt-1 d-block';
            msg.textContent = res.error || 'Error adding movie.';
        }
        setTimeout(() => msg.textContent = '', 3000);
    });
}

function cerrarSesion() { localStorage.removeItem('user'); window.location.href = 'login-register.html'; }

function goToUserProfile(userId) {
    window.location.href = 'user_profile.html?userId=' + userId;
}

loadMovieDetails();
cargarListas();
</script>
</body>
</html>
